<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cryptidbama: Contact US</title>

    <link rel="stylesheet" href="../styles/index.module.css" />
    <link rel="stylesheet" href="../styles/navbar.module.css" />

    <script src="../components/navbar.js" defer></script>
</head>
<body>
    <navbar-component></navbar-component>

    <div class="contact-container">
        <h1>Contact US</h1>
        <form class="contact-form">
            <div class="form-row">
                <label for="name">Name</label>
                <input type="text" id="name">
            </div>
            <div class="form-row">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>
            <div class="form-row textarea-row">
                <label for="message">Message</label>
                <textarea id="message" rows="5">Hi I met a leprechaun once. It took my money.</textarea>
            </div>
            <button type="submit" class="submit-btn">Submit</button>
        </form> 
    </div> 
</body>
</html>
